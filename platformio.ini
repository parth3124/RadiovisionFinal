[platformio]
default_envs = tx

[base]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I include
    -D WIFI_CH=1

[env:tx]
extends = base
build_src_filter = -<*> +<tx/>

[env:rx1]
extends = base
build_src_filter = -<*> +<rx/>
build_flags = ${base.build_flags} -D RX_ID=1

[env:rx2]
extends = base
build_src_filter = -<*> +<rx/>
build_flags = ${base.build_flags} -D RX_ID=2

[env:rx3]
extends = base
build_src_filter = -<*> +<rx/>
build_flags = ${base.build_flags} -D RX_ID=3

[env:rx4]
extends = base
build_src_filter = -<*> +<rx/>
build_flags = ${base.build_flags} -D RX_ID=4